name: test
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build as it will be on the real domain (the noindex tag used on netlify.app would fail the
      # Lighthouse SEO score), with a fake GA4 ID so the cookie banner can be tested. Then check
      # every page for broken links, missing files and SEO tags.
      - run: npm run build:test
      # The request form end to end, cookie consent, and an accessibility check on every page type.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Lighthouse on mobile for each page type in both languages.
      - run: npm run lighthouse
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            .lighthouseci
            test-results
