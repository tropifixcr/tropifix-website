name: test
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build, then check every page for broken links, missing files and SEO tags.
      - run: npm run build
      # Run the request form end to end at phone and desktop size.
      - run: npx playwright install --with-deps chromium
      - run: npm test
